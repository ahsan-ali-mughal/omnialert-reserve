version: "3.9"

services:

  # ---------------------------------------------------------------------
  # Cache & Edge Guard
  # ---------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: omni-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # Relational store
  # ---------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: omni-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: omni_reserve
      MYSQL_USER: omni
      MYSQL_PASSWORD: omni_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # Document store
  # ---------------------------------------------------------------------
  mongo:
    image: mongo:6.0
    container_name: omni-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # Message Streaming
  # ---------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: omni-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [omni-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: omni-kafka
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # AWS SNS / SQS emulation
  # ---------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3.5
    container_name: omni-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      DEBUG: 0
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - "./localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro"
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # Local SMTP catcher for the Email Worker (dev/test only)
  # ---------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: omni-mailhog
    ports:
      - "8025:8025"   # web UI
      - "1025:1025"   # smtp
    networks: [omni-net]

  # ---------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omni-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: omni_reserve
      MYSQL_USER: omni
      MYSQL_PASSWORD: omni_pass
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SNS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:order-notifications
      SQS_QUEUE_URL: http://localstack:4566/000000000000/order-email-queue
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      JWT_PUBLIC_KEY_PATH: classpath:certs/public_key.pem
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks: [omni-net]

networks:
  omni-net:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  localstack-data:
