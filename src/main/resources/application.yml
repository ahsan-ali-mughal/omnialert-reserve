spring:
  application:
    name: omnialert-reserve

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:omni_reserve}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:20}
      pool-name: OmniHikariPool
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: ${MONGO_DB:omni_reserve_docs}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
    consumer:
      group-id: order-persistence-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.omnialert.reserve.dto"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.omnialert.reserve.dto.OrderReservedEvent

  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  kafka:
    topic:
      order-reserved-events: order-reserved-events
  aws:
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
    region: ${AWS_REGION:us-east-1}
    access-key: ${AWS_ACCESS_KEY_ID:test}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test}
    sns-topic-arn: ${SNS_TOPIC_ARN:arn:aws:sns:us-east-1:000000000000:order-notifications}
    sqs-queue-url: ${SQS_QUEUE_URL:http://localhost:4566/000000000000/order-email-queue}
  redis:
    lock-ttl-minutes: 10

logging:
  level:
    root: INFO
    com.omnialert.reserve: DEBUG
    org.springframework.kafka: WARN

---
spring:
  config:
    activate:
      on-profile: docker
# All values above already resolve from environment variables set by docker-compose;
# this profile exists so `SPRING_PROFILES_ACTIVE=docker` is a valid, explicit switch.
